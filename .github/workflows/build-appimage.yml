name: Build Web AppImage

on:
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22 & pnpm
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack & Install Dependencies
        run: |
          corepack enable
          corepack pnpm --dir web install

      - name: Build Web App
        run: |
          # Build the site using the repository's native build command
          corepack pnpm --dir web build:site

      - name: Prepare Electron Wrapper for AppImage
        run: |
          mkdir -p electron-wrapper/app
          
          # Copy the built web distribution files into the electron app folder
          # (Based on README, Cloudflare Pages outputs to web/app/dist)
          cp -r web/app/dist/* electron-wrapper/app/
          
          cd electron-wrapper
          npm init -y
          npm install electron electron-builder --save-dev
          
          # Create a minimal electron main.js entry point
          cat << 'EOF' > main.js
          const { app, BrowserWindow } = require('electron')
          function createWindow () {
            const win = new BrowserWindow({ 
              width: 1200, 
              height: 800,
              webPreferences: {
                nodeIntegration: false,
                contextIsolation: true
              }
            })
            win.loadFile('app/index.html')
          }
          app.whenReady().then(createWindow)
          app.on('window-all-closed', () => {
            if (process.platform !== 'darwin') app.quit()
          })
          EOF

          # Configure package.json for electron-builder to build a Linux AppImage
          node -e '
            const pkg = require("./package.json");
            pkg.main = "main.js";
            pkg.build = {
              appId: "com.bitchord.webdesktop",
              productName: "BitChord",
              directories: { output: "dist" },
              linux: { target: ["AppImage"] },
              files: ["main.js", "app/**/*"]
            };
            require("fs").writeFileSync("package.json", JSON.stringify(pkg, null, 2));
          '

      - name: Build AppImage with Electron-Builder
        run: |
          cd electron-wrapper
          npx electron-builder --linux AppImage --publish never

      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BitChord-Linux-AppImage
          path: electron-wrapper/dist/*.AppImage
