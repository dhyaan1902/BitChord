name: Build and Release BitChord Desktop

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as GitHub Release'
        required: false
        type: boolean
        default: false
      tag_name:
        description: 'Release tag name (e.g. v1.0.0)'
        required: false
        type: string
        default: 'v1.0.0'
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: 'web/pnpm-lock.yaml'

      - name: Install Dependencies
        run: pnpm --dir web install

      - name: Build Web App & Extension
        env:
          VITE_PARTY_SERVER_URL: "https://party.bitchord.in"
        run: pnpm --dir web build:site

      - name: Prepare Electron Bundle
        run: |
          mkdir -p electron/app
          cp -r web/app/dist/* electron/app/
          mkdir -p electron/extension
          cp -r web/extension/.output/chrome-mv3/* electron/extension/
          cd electron
          npm install

      - name: Build Linux and Windows Packages
        run: |
          cd electron
          npx electron-builder --linux AppImage --win nsis portable --publish never

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BitChord-Desktop-Packages
          path: |
            electron/dist/*.AppImage
            electron/dist/*.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.create_release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          name: BitChord Desktop ${{ inputs.tag_name || github.ref_name }}
          files: |
            electron/dist/*.AppImage
            electron/dist/*.exe
          generate_release_notes: true
