name: Build Web AppImage

on:
  workflow_dispatch:
  push:
    paths:
      - 'web/**'
      - 'electron/**'
      - '.github/workflows/build-appimage.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: 'web/pnpm-lock.yaml'

      - name: Install Dependencies
        run: pnpm --dir web install

      - name: Build Web App
        env:
          VITE_PARTY_SERVER_URL: "https://party.bitchord.in"
        run: pnpm --dir web build:site

      - name: Prepare Electron Wrapper
        run: |
          mkdir -p electron/app
          cp -r web/app/dist/* electron/app/
          mkdir -p electron/extension
          cp -r web/extension/.output/chrome-mv3/* electron/extension/
          cd electron
          npm install

      - name: Build AppImage with Electron-Builder
        run: |
          cd electron
          npx electron-builder --linux AppImage --publish never

      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BitChord-Linux-AppImage
          path: electron/dist/*.AppImage
