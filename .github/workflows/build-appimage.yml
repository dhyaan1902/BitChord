name: Build Web AppImage

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: 'web/pnpm-lock.yaml'

      - name: Install Dependencies
        run: pnpm --dir web install

      - name: Build Web App
        env:
          # README notes vite build fails without VITE_PARTY_SERVER_URL
          VITE_PARTY_SERVER_URL: "https://party.bitchord.in"
        run: pnpm --dir web build:site

      - name: Prepare Electron Wrapper for AppImage
        run: |
          mkdir -p electron-wrapper/app
          cp -r web/app/dist/* electron-wrapper/app/
          
          cd electron-wrapper
          npm init -y
          npm install electron electron-builder --save-dev
          
          cat << 'EOF' > main.js
          const { app, BrowserWindow } = require('electron')
          function createWindow () {
            const win = new BrowserWindow({ 
              width: 1200, 
              height: 800,
              webPreferences: {
                nodeIntegration: false,
                contextIsolation: true
              }
            })
            win.loadFile('app/index.html')
          }
          app.whenReady().then(createWindow)
          app.on('window-all-closed', () => {
            if (process.platform !== 'darwin') app.quit()
          })
          EOF

          node -e '
            const pkg = require("./package.json");
            pkg.main = "main.js";
            pkg.build = {
              appId: "com.bitchord.webdesktop",
              productName: "BitChord",
              directories: { output: "dist" },
              linux: { target: ["AppImage"] },
              files: ["main.js", "app/**/*"]
            };
            require("fs").writeFileSync("package.json", JSON.stringify(pkg, null, 2));
          '

      - name: Build AppImage with Electron-Builder
        run: |
          cd electron-wrapper
          npx electron-builder --linux AppImage --publish never

      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BitChord-Linux-AppImage
          path: electron-wrapper/dist/*.AppImage
