name: Build Web AppImage

on:
  workflow_dispatch: # Allows you to manually trigger it from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Web Distribution
        run: ./gradlew :web:wasmJsBrowserDistribution --no-daemon
        # Note: Change `:web:wasmJsBrowserDistribution` to match your actual web module and task name (e.g. :webApp:jsBrowserDistribution)

      - name: Prepare Electron Wrapper
        run: |
          mkdir -p electron-wrapper/app
          # Copy your compiled web distribution files into the electron app folder
          # (Adjust the source path depending on where your Gradle build outputs the web files, e.g., build/dist/wasmJs/productionExecutable)
          cp -r build/dist/wasmJs/productionExecutable/* electron-wrapper/app/
          
          cd electron-wrapper
          npm init -y
          npm install electron electron-builder --save-dev
          
          # Create a minimal electron main.js entry point
          cat << 'EOF' > main.js
          const { app, BrowserWindow } = require('electron')
          function createWindow () {
            const win = new BrowserWindow({ width: 1200, height: 800 })
            win.loadFile('app/index.html')
          }
          app.whenReady().then(createWindow)
          EOF

          # Configure package.json for electron-builder to output an AppImage
          node -e '
            const pkg = require("./package.json");
            pkg.main = "main.js";
            pkg.build = {
              appId: "com.bitchord.desktop",
              productName: "BitChord",
              directories: { output: "dist" },
              linux: { target: ["AppImage"] }
            };
            require("fs").writeFileSync("package.json", JSON.stringify(pkg, null, 2));
          '

      - name: Build AppImage with Electron-Builder
        run: |
          cd electron-wrapper
          npx electron-builder --linux AppImage --publish never

      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BitChord-AppImage
          path: electron-wrapper/dist/*.AppImage
